# Analyse statique de sécurité, reliée à la plateforme Semgrep.
#
# Prérequis, à faire une seule fois et par toi :
#   1. compte sur https://semgrep.dev (connexion avec GitHub)
#   2. Settings -> Tokens -> Create new token (scope « Agent (CI) »)
#   3. dans le dépôt : Settings -> Secrets and variables -> Actions
#      -> New repository secret, nommé SEMGREP_APP_TOKEN
#
# Sans ce secret, le travail s'annonce ignoré au lieu d'échouer : un dépôt
# fraîchement cloné ne doit pas se mettre au rouge pour une configuration
# absente.
name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lundi 4 h 27 UTC. Les règles Semgrep évoluent : du code inchangé peut
    # devenir vulnérable parce qu'une faille vient d'être décrite.
    - cron: '27 4 * * 1'
  workflow_dispatch:

jobs:
  analyse:
    name: Analyse statique
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Vérifier que le jeton est configuré
        id: jeton
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "::notice::SEMGREP_APP_TOKEN absent — analyse ignorée."
            echo "Voir l'en-tête de .github/workflows/semgrep.yml."
          else
            echo "present=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.jeton.outputs.present == 'oui'
        with:
          # L'historique complet permet à Semgrep de ne signaler que ce que
          # ce push introduit, plutôt que de répéter tout le passif.
          fetch-depth: 0

      - name: semgrep ci
        if: steps.jeton.outputs.present == 'oui'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
