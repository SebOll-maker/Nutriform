# vhost nginx — nutriform.seboll.tech -> application Flask (127.0.0.1:5001)
#
# HTTPS ajouté ensuite automatiquement par certbot --nginx (redirection
# http -> https et renouvellement automatique).
#
# Pas d'auth_basic ici, contrairement à la démo NCR : une popup de mot de passe
# navigateur s'accorde mal avec une PWA installée sur l'écran d'accueil iOS.
# L'authentification est faite par l'application, par compte nominatif.
server {
    listen 80;
    listen [::]:80;
    server_name nutriform.seboll.tech;

    # Le service worker doit pouvoir piloter toute l'origine.
    #
    # Piège nginx, signalé par Semgrep (header-redefinition) : un add_header
    # dans un location ANNULE tous ceux du bloc server. Il n'y en a aucun
    # aujourd'hui, donc rien n'est perdu — mais le jour où on ajoute un
    # Strict-Transport-Security ou un Content-Security-Policy au niveau
    # server, il faudra le répéter ici, sans quoi /sw.js seul en sortira nu.
    location = /sw.js {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
